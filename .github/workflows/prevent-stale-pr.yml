name: Prevent Stale PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  check-stale:
    name: Check PR is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR is behind the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "Checking PR #$PR..."

          BASE_REF=$(gh api repos/$REPO/pulls/$PR --jq '.base.ref')
          HEAD_LABEL=$(gh api repos/$REPO/pulls/$PR --jq '.head.label')

          echo "Base branch : $BASE_REF"
          echo "Head branch : $HEAD_LABEL"

          COMPARE=$(gh api "repos/$REPO/compare/$BASE_REF...$HEAD_LABEL")

          STATUS=$(jq -r '.status' <<<"$COMPARE")
          BEHIND_BY=$(jq -r '.behind_by' <<<"$COMPARE")
          AHEAD_BY=$(jq -r '.ahead_by' <<<"$COMPARE")

          echo "Compare status : $STATUS"
          echo "Ahead by       : $AHEAD_BY"
          echo "Behind by      : $BEHIND_BY"

          if [ "$BEHIND_BY" -gt 0 ]; then
            echo "::error::This PR branch is behind '$BASE_REF' by $BEHIND_BY commit(s). Please merge or rebase the latest changes from '$BASE_REF'."
            exit 1
          fi

          echo "✅ PR branch is up to date with $BASE_REF."