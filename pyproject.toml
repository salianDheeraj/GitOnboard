[project]
name = "gitonboard"
version = "0.1.0"
description = "GitOnBoard: A Repository-Aware Multi-Agent Verification and Automated Repair Framework for AI-Generated Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "chromadb",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "httpx",
    "PyJWT",
    "sse-starlette",
    "requests",
    "azure-storage-blob>=12.19.0",
    "pytest-asyncio>=1.4.0",
    "docker>=7.1.0",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "langgraph>=1.2.11",
    "tokenizers>=0.23.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "src",
  "."
]
testpaths = [
  "tests",
  "backend/tests"
]
norecursedirs = [
  "data",
  ".venv"
]
